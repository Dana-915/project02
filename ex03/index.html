
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Colors & Opacity</h1>

    <h2>Color Palette</h2>

    <div class="color-palette">

        <div class="color-box named-color">
            <p>Named Color: Tomato</p>
        </div>

        <div class="color-box hex-color">
            <p>HEX: #3498db</p>
        </div>

        <div class="color-box rgb-color">
            <p>RGB: rgb(46, 204, 113)</p>
        </div>

        <div class="color-box rgba-color">
            <p>RGBA: rgba(155, 89, 182, 0.5)</p>
        </div>

    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <p>This box uses opacity: 0.5</p>
        <button>Click Me</button>
    </div>

    <div class="background-box">
        <p>This box uses RGBA background</p>
        <button>Click Me</button>
    </div>

</body>
</html>
